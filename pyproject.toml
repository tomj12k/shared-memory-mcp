[project]
name = "memory-server"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.0",
    "chromadb>=0.5",
    "openai>=1.0",
    "gitpython>=3.1",
]

[dependency-groups]
build = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
memory-server = "memory_server.server:main"
